##############################################################
# knoozbook.com — Nginx Config with Angular SSR
#
# FIX: The old config had:
#   location / { try_files $uri $uri/ /index.html; }
# This served Angular shell directly, bypassing Node.js SSR.
#
# NEW: Static assets served by Nginx (fast).
#      HTML page requests proxied to Node.js port 3000 (SSR).
##############################################################

upstream nodejs_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name knoozbook.com www.knoozbook.com;

    client_max_body_size 20M;

    # ---------- Static Assets (served directly by Nginx, no SSR) ----------
    # These file types never need SSR — serve fast with long cache
    location ~* \.(js|mjs|css|woff|woff2|ttf|otf|eot|svg|ico|png|jpg|jpeg|webp|gif|map|txt|xml|json|mp3|mp4|pdf|zip|epub)$ {
        root /var/www/kenouz/dist/browser;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
        access_log off;
    }

    # Sitemap files (served from browser dist, generated by sitemap service)
    location ~* ^/sitemap.*\.xml$ {
        root /var/www/kenouz/dist/browser;
        add_header Content-Type "application/xml; charset=UTF-8";
        expires 1d;
        try_files $uri =404;
    }

    # ---------- Uploads (served directly from uploads folder) ----------
    location ^~ /uploads/ {
        alias /var/www/kenouz/uploads/;
        expires 6M;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
        access_log off;
    }

    # ---------- API (proxy to Node.js, no SSR) ----------
    location /api/ {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ---------- HTML Pages → Node.js SSR (THE CRITICAL FIX) ----------
    # ALL non-asset requests go to Node.js which runs Angular SSR.
    # Node.js serves static assets from dist/browser itself,
    # and SSR-renders HTML pages via Angular CommonEngine.
    location / {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSR may take time — allow up to 30s before timeout
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Pass original URL for correct SSR rendering
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---------- SSL (managed by Certbot — do not edit) ----------
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/knoozbook.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knoozbook.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---------- HTTP → HTTPS Redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name knoozbook.com www.knoozbook.com;

    if ($host = www.knoozbook.com) {
        return 301 https://knoozbook.com$request_uri;
    }

    if ($host = knoozbook.com) {
        return 301 https://knoozbook.com$request_uri;
    }

    return 404;
}