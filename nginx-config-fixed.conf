server {
    listen 80;
    listen [::]:80;
    server_name knoozbook.com www.knoozbook.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name knoozbook.com www.knoozbook.com;

    # SSL certificates issued by Certbot
    ssl_certificate /etc/letsencrypt/live/knoozbook.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knoozbook.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # Uploads folder
    location ^~ /uploads/ {
        alias /var/www/kenouz-org/uploads/;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Static assets cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Angular app
    root /var/www/kenouz-org/dist/browser;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
