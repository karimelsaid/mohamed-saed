<div class="p-6 bg-gray-50 min-h-screen" dir="rtl">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">إدارة التصنيفات</h1>
    </div>

    <!-- Messages -->
    <div *ngIf="success" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
      <span class="block sm:inline">{{ success }}</span>
      <button class="absolute top-0 bottom-0 right-0 px-4 py-3" (click)="success = ''">
        <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
      </button>
    </div>
    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      <span class="block sm:inline">{{ error }}</span>
      <button class="absolute top-0 bottom-0 right-0 px-4 py-3" (click)="error = ''">
        <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
      </button>
    </div>

    <!-- Add Category Form -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
      <h2 class="text-xl font-bold text-gray-800 mb-4">إضافة تصنيف جديد</h2>
      <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">اسم التصنيف</label>
          <input type="text" [(ngModel)]="newCategory.name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="مثال: روايات وقصص">
        </div>
        <div class="w-full md:w-1/4">
          <label class="block text-sm font-medium text-gray-700 mb-1">النوع</label>
          <select [(ngModel)]="newCategory.type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="book">كتاب</option>
            <option value="other">أخرى</option>
          </select>
        </div>
        <div class="flex items-end">
          <button (click)="addCategory()" [disabled]="!newCategory.name || loading" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow disabled:opacity-50 transition-colors">
            إضافة
          </button>
        </div>
      </div>
    </div>

    <!-- Categories List -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-right">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-6 py-4 text-sm font-bold text-gray-600">اسم التصنيف</th>
              <th class="px-6 py-4 text-sm font-bold text-gray-600">النوع</th>
              <th class="px-6 py-4 text-sm font-bold text-gray-600">الحالة</th>
              <th class="px-6 py-4 text-sm font-bold text-gray-600">الإجراءات</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <tr *ngFor="let cat of categories" class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4">
                <div *ngIf="editingCategory?._id !== cat._id">{{ cat.name }}</div>
                <input *ngIf="editingCategory?._id === cat._id" type="text" [(ngModel)]="editingCategory.name" class="w-full px-3 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
              </td>
              <td class="px-6 py-4">
                <div *ngIf="editingCategory?._id !== cat._id">
                  <span class="px-3 py-1 text-xs rounded-full font-medium" [ngClass]="cat.type === 'book' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'">
                    {{ cat.type === 'book' ? 'كتاب' : 'أخرى' }}
                  </span>
                </div>
                <select *ngIf="editingCategory?._id === cat._id" [(ngModel)]="editingCategory.type" class="px-3 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                  <option value="book">كتاب</option>
                  <option value="other">أخرى</option>
                </select>
              </td>
              <td class="px-6 py-4">
                <div *ngIf="editingCategory?._id !== cat._id">
                  <span *ngIf="cat.isActive" class="text-green-600"><i class="fas fa-check-circle mr-1"></i> نشط</span>
                  <span *ngIf="!cat.isActive" class="text-red-600"><i class="fas fa-times-circle mr-1"></i> غير نشط</span>
                </div>
                <label *ngIf="editingCategory?._id === cat._id" class="flex items-center space-x-2 space-x-reverse cursor-pointer">
                  <input type="checkbox" [(ngModel)]="editingCategory.isActive" class="form-checkbox h-5 w-5 text-blue-600 rounded">
                  <span>نشط</span>
                </label>
              </td>
              <td class="px-6 py-4">
                <div class="flex gap-2" *ngIf="editingCategory?._id !== cat._id">
                  <button (click)="editCategory(cat)" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="تعديل">
                    تعديل
                  </button>
                  <button (click)="deleteCategory(cat._id)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="حذف">
                    حذف
                  </button>
                </div>
                <div class="flex gap-2" *ngIf="editingCategory?._id === cat._id">
                  <button (click)="updateCategory()" [disabled]="!editingCategory.name || loading" class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors disabled:opacity-50" title="حفظ">
                    حفظ
                  </button>
                  <button (click)="cancelEdit()" class="p-2 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors" title="إلغاء">
                    إلغاء
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="categories.length === 0 && !loading">
              <td colspan="4" class="px-6 py-8 text-center text-gray-500">لا توجد تصنيفات حالياً</td>
            </tr>
            <tr *ngIf="loading">
              <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                <i class="fas fa-spinner fa-spin mr-2"></i> جاري التحميل...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
