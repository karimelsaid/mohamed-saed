<h2>إدارة قواعد الشحن المجاني</h2>

<form (ngSubmit)="saveRules()">
  <label>
    تفعيل الشحن المجاني:
    <input type="checkbox" [(ngModel)]="freeShippingEnabled" name="freeShippingEnabled" />
  </label>

  <div>
    <label>الحد الأدنى للكمية للحصول على شحن مجاني:</label>
    <input type="number" [(ngModel)]="minQuantity" name="minQuantity" min="0" />
  </div>

  <div>
    <label>الحد الأدنى لقيمة الطلب للحصول على شحن مجاني:</label>
    <input type="number" [(ngModel)]="minOrderValue" name="minOrderValue" min="0" step="0.01" />
  </div>

  <div>
    <label>فئات المستخدمين المشمولة (يمكن إضافة لاحقاً):</label>
    <input type="text" placeholder="مثال: VIP, Premium" disabled />
  </div>

  <div>
    <label>المنتجات أو الفئات المشمولة (يمكن إضافة لاحقاً):</label>
    <input type="text" placeholder="مثال: كتب تعليمية" disabled />
  </div>

  <div>
    <label>المحافظات المشمولة (يمكن إضافة لاحقاً):</label>
    <input type="text" placeholder="مثال: القاهرة, الجيزة" disabled />
  </div>

  <button type="submit">حفظ القواعد</button>
</form>
