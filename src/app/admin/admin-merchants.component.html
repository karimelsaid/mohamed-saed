<div class="max-w-6xl mx-auto p-4">
  <h2 class="text-2xl font-bold mb-6">إدارة التجار</h2>

  <table class="min-w-full border border-gray-300 rounded">
    <thead>
      <tr class="bg-gray-200">
        <th class="border border-gray-300 px-4 py-2">اسم التاجر</th>
        <th class="border border-gray-300 px-4 py-2">البريد الإلكتروني</th>
        <th class="border border-gray-300 px-4 py-2">الشعار</th>
        <th class="border border-gray-300 px-4 py-2">الحالة</th>
        <th class="border border-gray-300 px-4 py-2">تاريخ التسجيل</th>
        <th class="border border-gray-300 px-4 py-2">إجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let merchant of merchants">
        <td class="border border-gray-300 px-4 py-2">{{ merchant.name }}</td>
        <td class="border border-gray-300 px-4 py-2">{{ merchant.email }}</td>
        <td class="border border-gray-300 px-4 py-2">
          <img *ngIf="merchant.logo" [src]="'/uploads/merchants/' + merchant.logo" alt="شعار التاجر" class="w-12 h-12 object-contain" />
          <span *ngIf="!merchant.logo">لا يوجد شعار</span>
        </td>
        <td class="border border-gray-300 px-4 py-2">{{ merchant.approved ? 'موافق عليه' : 'في انتظار الموافقة' }}</td>
        <td class="border border-gray-300 px-4 py-2">{{ merchant.createdAt | date:'short' }}</td>
        <td class="border border-gray-300 px-4 py-2">
          <button (click)="toggleApproval(merchant)" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1 px-3 rounded">
            {{ merchant.approved ? 'رفض' : 'موافقة' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
