<div class="p-6 bg-white dark:bg-gray-800 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white flex items-center gap-2">
        <fa-icon [icon]="faBell" class="text-yellow-500"></fa-icon>
        مركز التحكم بالإشعارات
    </h2>

    <!-- Tabs -->
    <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
        <button (click)="activeTab = 'manual'" [class.border-yellow-500]="activeTab === 'manual'"
            [class.text-yellow-600]="activeTab === 'manual'"
            class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 focus:outline-none border-b-2 border-transparent transition-colors duration-200">
            <fa-icon [icon]="faPaperPlane" class="mr-2"></fa-icon>
            إرسال يدوي
        </button>
        <button (click)="activeTab = 'library'" [class.border-yellow-500]="activeTab === 'library'"
            [class.text-yellow-600]="activeTab === 'library'"
            class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 focus:outline-none border-b-2 border-transparent transition-colors duration-200">
            <fa-icon [icon]="faBookOpen" class="mr-2"></fa-icon>
            من المكتبة
        </button>
    </div>

    <!-- Manual Form -->
    <div *ngIf="activeTab === 'manual'" class="space-y-4">
        <div>
            <label class="block text-sm font-bold mb-2 dark:text-gray-300">عنوان الإشعار</label>
            <input [(ngModel)]="manualTitle" type="text"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white pointer-events-auto"
                placeholder="مثال: خصم خاص لك!">
        </div>
        <div>
            <label class="block text-sm font-bold mb-2 dark:text-gray-300">نص الإشعار</label>
            <textarea [(ngModel)]="manualBody" rows="3"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white pointer-events-auto"
                placeholder="اكتب رسالتك هنا..."></textarea>
        </div>
        <div>
            <label class="block text-sm font-bold mb-2 dark:text-gray-300">رابط التوجيه (اختياري)</label>
            <input [(ngModel)]="manualUrl" type="text"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white pointer-events-auto"
                placeholder="/how-to-earn">
        </div>
        <div>
            <label class="block text-sm font-bold mb-2 dark:text-gray-300">معرف المستخدم (اختياري - اتركه فارغاً
                للكل)</label>
            <input [(ngModel)]="manualUserId" type="text"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white pointer-events-auto"
                placeholder="User ID">
        </div>

        <button (click)="sendManual()" [disabled]="isSending"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full transition-colors flex justify-center items-center gap-2">
            <span *ngIf="isSending">جاري الإرسال...</span>
            <span *ngIf="!isSending">إرسال الآن</span>
            <fa-icon [icon]="faPaperPlane"></fa-icon>
        </button>
    </div>

    <!-- Library Form -->
    <div *ngIf="activeTab === 'library'" class="space-y-4">
        <div>
            <label class="block text-sm font-bold mb-2 dark:text-gray-300">اختر قالب</label>
            <select [(ngModel)]="selectedTemplateId"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white pointer-events-auto">
                <option value="" disabled selected>-- اختر رسالة جاهزة --</option>
                <option *ngFor="let item of libraryContent" [value]="item.id">
                    {{ item.title }}
                </option>
            </select>
        </div>

        <div *ngIf="selectedTemplate"
            class="p-4 bg-gray-50 dark:bg-gray-700 rounded border border-gray-200 dark:border-gray-600">
            <h4 class="font-bold text-gray-800 dark:text-white mb-2">{{ selectedTemplate.title }}</h4>
            <p class="text-gray-600 dark:text-gray-300">{{ selectedTemplate.body }}</p>
        </div>

        <div>
            <label class="block text-sm font-bold mb-2 dark:text-gray-300">معرف المستخدم (اختياري - اتركه فارغاً
                للكل)</label>
            <input [(ngModel)]="manualUserId" type="text"
                class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white pointer-events-auto"
                placeholder="User ID">
        </div>

        <button (click)="sendFromLibrary()" [disabled]="!selectedTemplateId || isSending"
            class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full transition-colors flex justify-center items-center gap-2">
            <span *ngIf="isSending">جاري الإرسال...</span>
            <span *ngIf="!isSending">إرسال القالب المختار</span>
            <fa-icon [icon]="faPaperPlane"></fa-icon>
        </button>
    </div>

    <!-- Status Message -->
    <div *ngIf="statusMessage" class="mt-4 p-3 rounded"
        [ngClass]="{'bg-green-100 text-green-700': statusMessage.includes('Success'), 'bg-red-100 text-red-700': statusMessage.includes('Error')}">
        {{ statusMessage }}
    </div>
</div>
