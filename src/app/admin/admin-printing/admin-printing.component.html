<div class="container mx-auto p-4 md:p-8" dir="rtl">
    <div
        class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-700">
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-800 p-8 text-white relative overflow-hidden">
            <div class="absolute top-0 right-0 p-10 opacity-10">
                <fa-icon [icon]="faPrint" size="6x"></fa-icon>
            </div>
            <div class="relative z-10">
                <h2 class="text-3xl font-extrabold flex items-center gap-3 mb-2">
                    <fa-icon [icon]="faPrint"></fa-icon>
                    إعدادات وأسعار خدمة الطباعة
                </h2>
                <p class="text-blue-100 opacity-90">إدارة تكاليف الورق، الأغلفة، وألوان الطباعة بشكل ديناميكي</p>
            </div>
        </div>

        <div *ngIf="isLoading" class="p-20 flex flex-col items-center justify-center space-y-4">
            <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-500 dark:text-gray-400 font-medium">جاري تحميل الأسعار الحالية...</p>
        </div>

        <div *ngIf="!isLoading" class="p-8 space-y-10">
            <!-- Paper Prices Section -->
            <section>
                <h3
                    class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-6 flex items-center gap-2 border-r-4 border-blue-600 pr-3">
                    <fa-icon [icon]="faLayerGroup" class="text-blue-600"></fa-icon>
                    أسعار الورق (لكل ورقة A4 كاملة)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- B5 Section -->
                    <div
                        class="bg-gray-50 dark:bg-gray-700/50 p-6 rounded-2xl border border-gray-200 dark:border-gray-600">
                        <h4 class="font-bold text-lg mb-4 text-blue-700 dark:text-blue-400">حجم B5</h4>
                        <div class="space-y-4">
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">أبيض</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.B5.white" step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">أصفر</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.B5.yellow"
                                        step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">كريمي</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.B5.creamy"
                                        step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- A4 Section -->
                    <div
                        class="bg-gray-50 dark:bg-gray-700/50 p-6 rounded-2xl border border-gray-200 dark:border-gray-600">
                        <h4 class="font-bold text-lg mb-4 text-blue-700 dark:text-blue-400">حجم A4</h4>
                        <div class="space-y-4">
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">أبيض</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.A4.white" step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">أصفر</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.A4.yellow"
                                        step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">كريمي</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.A4.creamy"
                                        step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- A5 Section -->
                    <div
                        class="bg-gray-50 dark:bg-gray-700/50 p-6 rounded-2xl border border-gray-200 dark:border-gray-600">
                        <h4 class="font-bold text-lg mb-4 text-blue-700 dark:text-blue-400">حجم A5</h4>
                        <div class="space-y-4">
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">أبيض</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.A5.white" step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">أصفر</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.A5.yellow"
                                        step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                            <div
                                class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                                <label class="text-gray-600 dark:text-gray-300">كريمي</label>
                                <div class="relative w-32">
                                    <input type="number" [(ngModel)]="printingSettings.paperPrices.A5.creamy"
                                        step="0.01"
                                        class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-left">
                                    <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Covers and Colors Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-6">
                <!-- Cover Prices -->
                <section>
                    <h3
                        class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-6 flex items-center gap-2 border-r-4 border-purple-600 pr-3">
                        <fa-icon [icon]="faPrint" class="text-purple-600"></fa-icon>
                        أسعار التغليف
                    </h3>
                    <div
                        class="bg-gray-50 dark:bg-gray-700/50 p-6 rounded-2xl border border-gray-200 dark:border-gray-600 space-y-4">
                        <div
                            class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                            <label class="text-gray-600 dark:text-gray-300">غلاف ورقي (Soft Cover)</label>
                            <div class="relative w-32">
                                <input type="number" [(ngModel)]="printingSettings.coverPrices.soft" step="1"
                                    class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none text-left">
                                <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                            </div>
                        </div>
                        <div
                            class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                            <label class="text-gray-600 dark:text-gray-300">غلاف مجلد (Hard Cover)</label>
                            <div class="relative w-32">
                                <input type="number" [(ngModel)]="printingSettings.coverPrices.hard" step="1"
                                    class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none text-left">
                                <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                            </div>
                        </div>
                        <div
                            class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                            <label class="text-gray-600 dark:text-gray-300">غلاف جلد فاخر (Luxury Leather)</label>
                            <div class="relative w-32">
                                <input type="number" [(ngModel)]="printingSettings.coverPrices.luxuryLeather" step="1"
                                    class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none text-left">
                                <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Color Extra Costs -->
                <section>
                    <h3
                        class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-6 flex items-center gap-2 border-r-4 border-green-600 pr-3">
                        <fa-icon [icon]="faMoneyBillWave" class="text-green-600"></fa-icon>
                        تكلفة اللون (إضافية لكل صفحة)
                    </h3>
                    <div
                        class="bg-gray-50 dark:bg-gray-700/50 p-6 rounded-2xl border border-gray-200 dark:border-gray-600 space-y-4">
                        <div
                            class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                            <label class="text-gray-600 dark:text-gray-300">أبيض وأسود <small
                                    class="text-gray-400">(إضافي)</small></label>
                            <div class="relative w-32">
                                <input type="number" [(ngModel)]="printingSettings.printColorPrices.blackAndWhite"
                                    step="0.01"
                                    class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-left">
                                <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                            </div>
                        </div>
                        <div
                            class="flex items-center justify-between bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
                            <label class="text-gray-600 dark:text-gray-300">ألوان <small
                                    class="text-gray-400">(إضافي)</small></label>
                            <div class="relative w-32">
                                <input type="number" [(ngModel)]="printingSettings.printColorPrices.color" step="0.01"
                                    class="w-full pl-8 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-left">
                                <span class="absolute left-3 top-2 text-gray-400 text-xs">ج.م</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-4 pt-10 border-t border-gray-100 dark:border-gray-700">
                <button (click)="saveSettings()" [disabled]="isSaving"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl transition-all shadow-lg hover:shadow-blue-500/25 flex items-center justify-center gap-3 disabled:opacity-50">
                    <fa-icon [icon]="faSave" *ngIf="!isSaving"></fa-icon>
                    <div *ngIf="isSaving"
                        class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    {{ isSaving ? 'جاري الحفظ...' : 'حفظ التغييرات' }}
                </button>
                <button (click)="resetSettings()" [disabled]="isSaving"
                    class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-bold py-4 px-8 rounded-2xl transition-all flex items-center justify-center gap-3 disabled:opacity-50">
                    <fa-icon [icon]="faUndo"></fa-icon>
                    استعادة الأصلي
                </button>
            </div>
        </div>
    </div>
</div>
