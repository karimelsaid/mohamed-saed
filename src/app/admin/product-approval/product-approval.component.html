<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">إدارة منتجات التجار</h1>

  <div *ngIf="loading" class="text-center">جاري التحميل...</div>
  <div *ngIf="error" class="text-red-500">{{ error }}</div>

  <!-- Success Toast Notification -->
  <div *ngIf="showSuccessToast" class="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded shadow-lg z-50">
    {{ successMessage }}
  </div>

  <div class="grid gap-4">
    <div *ngFor="let product of products" class="bg-white p-4 rounded shadow">
      <h2 class="text-lg font-semibold">{{ product.product_name }}</h2>
      <p>الوصف: {{ product.product_description }}</p>
      <p>السعر: {{ product.product_price }} ج.م</p>
      <p>التاجر: {{ product.merchantId?.username || 'غير محدد' }}</p>
      <div class="mt-2">
        <button
          (click)="approveProduct(product._id)"
          [disabled]="isApproving(product._id)"
          class="bg-green-500 text-white px-4 py-2 rounded mr-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isApproving(product._id) ? 'جاري الموافقة...' : 'موافقة' }}
        </button>
        <button (click)="rejectProduct(product._id)" class="bg-red-500 text-white px-4 py-2 rounded">رفض</button>
      </div>
    </div>
  </div>

  <div *ngIf="products.length === 0 && !loading" class="text-center mt-4">
    لا توجد منتجات معلقة للموافقة
  </div>
</div>
