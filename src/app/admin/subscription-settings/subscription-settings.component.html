<div
    class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 animate-fade-in">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white flex items-center gap-2">
        <fa-icon [icon]="['fas', 'crown']" class="text-yellow-500"></fa-icon>
        إعدادات أسعار الاشتراكات
    </h2>

    <div *ngIf="isLoading" class="flex justify-center py-10">
        <fa-icon [icon]="['fas', 'spinner']" class="text-4xl text-blue-500 animate-spin"></fa-icon>
    </div>

    <div *ngIf="!isLoading">

        <!-- Alerts -->
        <div *ngIf="successMessage"
            class="bg-green-100 border border-green-200 text-green-700 px-4 py-3 rounded mb-4 flex items-center gap-2">
            <fa-icon [icon]="['fas', 'check-circle']"></fa-icon>
            {{ successMessage }}
        </div>

        <div *ngIf="errorMessage"
            class="bg-red-100 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 flex items-center gap-2">
            <fa-icon [icon]="['fas', 'exclamation-circle']"></fa-icon>
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="saveSettings()" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <!-- Monthly Plan -->
                <div
                    class="bg-blue-50 dark:bg-blue-900/10 p-5 rounded-xl border border-blue-100 dark:border-blue-900/30">
                    <h3 class="font-bold text-lg mb-4 text-blue-800 dark:text-blue-300 flex items-center gap-2">
                        <fa-icon [icon]="['fas', 'calendar-alt']"></fa-icon>
                        الاشتراك الشهري
                    </h3>

                    <div>
                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">السعر (جنيه
                            مصري)</label>
                        <div class="relative">
                            <input type="number" [(ngModel)]="subscriptionSettings.monthlyPrice" name="monthlyPrice"
                                required min="0"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white transition-all">
                            <span class="absolute left-3 top-3 text-gray-500 dark:text-gray-400 font-bold">EGP</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">السعر الحالي: {{ subscriptionSettings.monthlyPrice }}
                            ج.م/شهر</p>
                    </div>
                </div>

                <!-- Yearly Plan -->
                <div
                    class="bg-purple-50 dark:bg-purple-900/10 p-5 rounded-xl border border-purple-100 dark:border-purple-900/30">
                    <h3 class="font-bold text-lg mb-4 text-purple-800 dark:text-purple-300 flex items-center gap-2">
                        <fa-icon [icon]="['fas', 'calendar-check']"></fa-icon>
                        الاشتراك السنوي
                    </h3>

                    <div>
                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">السعر (جنيه
                            مصري)</label>
                        <div class="relative">
                            <input type="number" [(ngModel)]="subscriptionSettings.yearlyPrice" name="yearlyPrice"
                                required min="0"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 dark:bg-gray-700 dark:text-white transition-all">
                            <span class="absolute left-3 top-3 text-gray-500 dark:text-gray-400 font-bold">EGP</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">السعر الحالي: {{ subscriptionSettings.yearlyPrice }}
                            ج.م/سنة</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t dark:border-gray-700">
                <button type="submit" [disabled]="isSaving"
                    class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 flex items-center gap-2 text-lg disabled:opacity-70 disabled:cursor-not-allowed">
                    <span *ngIf="!isSaving">
                        <fa-icon [icon]="['fas', 'save']"></fa-icon>
                        حفظ التعديلات
                    </span>
                    <span *ngIf="isSaving">
                        <fa-icon [icon]="['fas', 'spinner']" class="animate-spin"></fa-icon>
                        جاري الحفظ...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
