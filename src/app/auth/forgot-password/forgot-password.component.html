<div class="mt-40">
  <div class="forgot-password-container max-w-md mx-auto p-6 bg-white dark:bg-gray-900 rounded-md shadow-md">
    <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-6">نسيت كلمة المرور</h2>
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-gray-600 dark:text-gray-300 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200" />
      </div>
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-300">إرسال رابط إعادة التعيين</button>
    </form>
    <p class="mt-4 text-green-600 dark:text-green-400" *ngIf="message">{{ message }}</p>
    <p class="mt-4 text-red-600 dark:text-red-400" *ngIf="error">{{ error }}</p>
  </div>
</div>
