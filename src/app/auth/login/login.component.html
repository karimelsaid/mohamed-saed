<div class="min-h-screen bg-gray-50 dark:bg-gray-900 pt-20 pb-12 px-4 sm:px-6 lg:px-8 rtl" dir="rtl">
  <!-- Background Decor -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -left-24 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 right-1/4 w-96 h-96 bg-yellow-500/10 rounded-full blur-3xl"></div>
  </div>

  <div class="max-w-md mx-auto relative z-10">
    <!-- Logo or Branding Header -->
    <div class="text-center mb-8 md:mt-20">
      <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">أهلاً بعودتك! 👋</h2>
      <p class="text-gray-500 dark:text-gray-400">سجل الدخول للمتابعة في عالم كنوز بوك</p>
    </div>

    <!-- Main Card -->
    <div
      class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 dark:border-gray-700 overflow-hidden p-8">

      <!-- Google Sign In -->
      <div class="mb-8">
        <div *ngIf="!isAndroid" id="googleSignInDiv" class="flex justify-center w-full"></div>
        <button *ngIf="isAndroid" (click)="googleSignIn()"
          class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-xl border border-gray-300 shadow-sm transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-6 h-6"
            style="width: 24px; height: 24px; display: block;">
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            <path fill="none" d="M0 0h48v48H0z" />
          </svg>
          <span>الدخول باستخدام Google</span>
        </button>

        <div class="relative mt-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white dark:bg-gray-800 text-gray-500">أو عبر البريد الإلكتروني</span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div *ngIf="message" class="mb-6 p-4 rounded-xl text-center text-sm font-bold animate-in slide-in-from-top-2"
        [ngClass]="isSuccess ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'">
        {{ message }}
      </div>

      <form (submit)="onLogin(); $event.preventDefault()" class="space-y-6">
        <!-- Email -->
        <div class="relative group">
          <div
            class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors">
            <fa-icon [icon]="faEnvelope"></fa-icon>
          </div>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="البريد الإلكتروني"
            class="w-full pr-11 pl-4 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all dark:text-white">
        </div>

        <!-- Password -->
        <div>
          <div class="relative group">
            <div
              class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors">
              <fa-icon [icon]="faLock"></fa-icon>
            </div>
            <input type="password" [(ngModel)]="password" name="password" required placeholder="كلمة المرور"
              class="w-full pr-11 pl-4 py-3 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all dark:text-white">
          </div>
          <div class="flex justify-end mt-2">
            <a routerLink="/forgot-password"
              class="text-sm font-medium text-blue-600 dark:text-blue-400 hover:text-blue-500">نسيت كلمة السر؟</a>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all transform hover:-translate-y-0.5">
          تسجيل الدخول
        </button>
      </form>

      <!-- Footer Link -->
      <div class="mt-8 text-center border-t border-gray-100 dark:border-gray-700 pt-6">
        <p class="text-gray-600 dark:text-gray-400 text-sm">
          ليس لديك حساب؟
          <a routerLink="/register" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">أنشئ حساب
            جديد</a>
        </p>
      </div>
    </div>
  </div>
</div>
