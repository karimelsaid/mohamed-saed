<div class="mt-40 p-6 max-w-md mx-auto bg-white dark:bg-gray-800 rounded-md shadow-md">
  <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-6">إعادة تعيين كلمة المرور</h2>
  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="newPassword" class="block text-gray-600 dark:text-gray-300 mb-1">كلمة المرور الجديدة</label>
      <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" required
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200" />
    </div>
    <div>
      <label for="confirmPassword" class="block text-gray-600 dark:text-gray-300 mb-1">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200" />
    </div>
    <button type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-300">تحديث كلمة المرور</button>
  </form>
  <p class="mt-4 text-green-600 dark:text-green-400" *ngIf="message">{{ message }}</p>
  <p class="mt-4 text-red-600 dark:text-red-400" *ngIf="error">{{ error }}</p>
</div>
