<!-- أيقونة الدردشة العائمة بتصميم عصري -->
<div class="fixed bottom-44 md:bottom-28 left-4 z-50 transition-transform duration-300 hover:scale-110"
  *ngIf="!isVisible" (click)="toggleVisibility()" title="Chat with AI">
  <div
    class="w-11 h-11 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-full shadow-2xl flex items-center justify-center cursor-pointer relative overflow-hidden group">
    <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
    <span class="text-xl transform group-hover:rotate-12 transition-transform duration-300">💬</span>
    
    <!-- Tooltip -->
    <span
        class="absolute left-full ml-3 bg-gray-900/90 backdrop-blur-sm text-white text-xs py-2 px-3 rounded-xl opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap pointer-events-none shadow-xl border border-white/10">
        المساعد الذكي 🤖
    </span>

    <!-- نبض إشعار اختياري -->
    <span class="absolute top-0 right-0 -mt-0.5 -mr-0.5 flex h-3 w-3">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
    </span>
  </div>
</div>

<!-- نافذة الدردشة الرئيسية -->
<div class="fixed z-50 flex flex-col transition-all duration-300 ease-in-out font-sans" *ngIf="isVisible"
  [ngClass]="{'fullscreen-mode': isFullscreen, 'window-mode': !isFullscreen}"
  [ngStyle]="!isFullscreen ? {'left.px': posX, 'top.px': posY, 'width.px': chatWindowWidth, 'height.px': chatWindowHeight} : {}">

  <!-- تأثير الزجاج الخلفي -->
  <div
    class="absolute inset-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 dark:border-gray-700/50 overflow-hidden">
  </div>

  <!-- المحتوى الداخلي -->
  <div class="relative flex flex-col h-full z-10">

    <!-- الرأس Header -->
    <div
      class="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-blue-600/90 to-indigo-600/90 text-white shadow-md cursor-move select-none"
      (mousedown)="onDragStart($event)" (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd($event)">
      <div class="flex items-center space-x-3 rtl:space-x-reverse">
        <div
          class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm border border-white/30">
          <span class="text-xl">🤖</span>
        </div>
        <div>
          <h3 class="font-bold text-lg leading-tight">المساعد الذكي</h3>
          <p class="text-xs text-blue-100 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            متصل الآن
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button class="p-2 rounded-full hover:bg-white/20 transition-colors focus:outline-none"
          (click)="toggleFullscreen(); $event.stopPropagation()" (mousedown)="$event.stopPropagation()"
          (touchstart)="$event.stopPropagation()" (touchend)="$event.stopPropagation()"
          [title]="isFullscreen ? 'تصغير' : 'تكبير'">
          <svg *ngIf="!isFullscreen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
          <svg *ngIf="isFullscreen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 18h16M6 4v16M18 4v16" />
          </svg>
        </button>
        <button class="p-2 rounded-full hover:bg-red-500/80 transition-colors focus:outline-none"
          (click)="toggleVisibility()" (mousedown)="$event.stopPropagation()" (touchstart)="$event.stopPropagation()"
          (touchend)="$event.stopPropagation()" title="إغلاق">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- منطقة الرسائل Messages Area -->
    <div #messagesContainer class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth custom-scrollbar">

      <!-- Quick Actions (تظهر فقط عند عدم وجود رسائل) -->
      <app-quick-actions
        *ngIf="messages.length === 0"
        [conversationId]="conversationId"
        [showWelcome]="true"
        (actionSelected)="onQuickActionSelected($event)"
        (bookSelected)="onBookSelected($event)">
      </app-quick-actions>

      <ng-container *ngFor="let message of messages">
        <!-- رسائل المستخدم -->
        <div *ngIf="message.role === 'user'" class="flex justify-end animate-fade-in-up">
          <div
            class="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl rounded-tr-sm px-5 py-3 max-w-[85%] shadow-md break-words text-sm md:text-base leading-relaxed">
            <div [innerHTML]="sanitize(message.content)"></div>
          </div>
        </div>

        <!-- رسائل المساعد -->
        <div *ngIf="message.role === 'assistant'" class="flex justify-start animate-fade-in-up">
          <div class="flex items-end gap-2 max-w-[85%]">
            <div
              class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900 border border-indigo-200 dark:border-indigo-700 flex items-center justify-center flex-shrink-0">
              <span class="text-sm">🤖</span>
            </div>
            <div class="flex flex-col gap-2">
              <div
                class="bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 border border-gray-100 dark:border-gray-700 rounded-2xl rounded-tl-sm px-5 py-3 shadow-sm break-words text-sm md:text-base leading-relaxed">
                <div [innerHTML]="sanitize(message.content)"></div>
              </div>
              
              <!-- أزرار الكتب -->
              <div *ngIf="message.books && message.books.length > 0" class="flex flex-col gap-2 mt-2">
                <div *ngFor="let book of message.books" 
                     class="bg-gradient-to-r from-green-50 to-emerald-50 dark:from-green-900/20 dark:to-emerald-900/20 border border-green-200 dark:border-green-700 rounded-xl p-3 shadow-sm hover:shadow-md transition-shadow">
                  <div class="flex items-center justify-between gap-3">
                    <div class="flex-1 min-w-0">
                      <h4 class="font-bold text-sm text-gray-800 dark:text-gray-200 truncate">{{ book.title }}</h4>
                      <p *ngIf="book.author && book.author !== 'غير محدد'" class="text-xs text-gray-600 dark:text-gray-400">{{ book.author }}</p>
                      <p class="text-sm font-semibold text-green-600 dark:text-green-400">{{ book.price }} ج.م</p>
                    </div>
                    <button (click)="openBookDetails(book.buyUrl)" 
                            class="flex-shrink-0 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm hover:shadow">
                      شراء 🛒
                    </button>
                  </div>
                </div>
              </div>

              <!-- أزرار الإجراءات (عند عدم توفر كتاب) -->
              <div *ngIf="message.buttons && message.buttons.length > 0" class="flex flex-col gap-2 mt-2">
                <button *ngFor="let btn of message.buttons"
                        (click)="onButtonClick(btn)"
                        class="w-full text-right px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 border bg-blue-50 hover:bg-blue-100 border-blue-200 text-blue-700 dark:bg-blue-900/20 dark:hover:bg-blue-900/40 dark:border-blue-700 dark:text-blue-300 shadow-sm hover:shadow active:scale-95">
                  {{ btn.label }}
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- رسائل النظام -->
        <div *ngIf="message.role === 'system'" class="flex justify-center my-4 animate-fade-in">
          <span
            class="bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 text-xs px-3 py-1 rounded-full shadow-sm border border-gray-200 dark:border-gray-700">
            {{ message.content }}
          </span>
        </div>
      </ng-container>

      <!-- مؤشر الكتابة Text Indicator -->
      <div *ngIf="isTyping" class="flex justify-start animate-fade-in">
        <div
          class="flex items-center gap-2 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm ml-10">
          <div class="typing-dot bg-blue-500"></div>
          <div class="typing-dot bg-blue-500 delay-100"></div>
          <div class="typing-dot bg-blue-500 delay-200"></div>
        </div>
      </div>
    </div>

    <!-- منطقة الإدخال Input Area -->
    <div
      class="p-4 bg-white/50 dark:bg-gray-900/50 backdrop-blur-md border-t border-gray-200/50 dark:border-gray-700/50">
      <div
        class="relative flex items-end gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl shadow-inner px-4 py-2 transition-shadow focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:border-blue-500">
        <textarea [(ngModel)]="newMessage" placeholder="اكتب رسالتك..."
          (keydown.enter)="$event.preventDefault(); sendMessage()"
          class="w-full bg-transparent border-none text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-0 resize-none max-h-32 py-2 pr-0 pl-2 text-sm leading-6"
          rows="1" style="min-height: 40px;" #chatInput
          (input)="chatInput.style.height = 'auto'; chatInput.style.height = chatInput.scrollHeight + 'px'"></textarea>

        <button [disabled]="isLoading || !newMessage.trim()" (click)="sendMessage()"
          class="mb-1 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-md transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed hover:scale-105 active:scale-95 mx-auto">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90 rtl:rotate-180" viewBox="0 0 20 20"
            fill="currentColor">
            <path
              d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
          </svg>
        </button>
      </div>
      <div class="text-center mt-2">
        <span class="text-[10px] text-gray-400 dark:text-gray-500">مدعوم بواسطة الذكاء الاصطناعي
 - ما زال تحت التجربه والتحسينات</span>
      </div>
    </div>

  </div>
</div>
