<div class="quick-actions-container" *ngIf="showWelcome">
  <!-- Welcome Message -->
  <div class="welcome-message" *ngIf="!showSubActions && !showCategories">
    <div class="welcome-text">
      👋 أهلاً بك في مكتبة كنوز.
    </div>
    <div class="welcome-subtext">
      يسعدني مساعدتك في العثور على أفضل كتاب يناسبك.
    </div>
    <div class="welcome-subtext">
      اختر أحد الخيارات التالية أو اكتب سؤالك مباشرة.
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>

  <!-- Default Quick Actions -->
  <div class="quick-actions-grid" *ngIf="!isLoading && !showSubActions && !showCategories">
    <!-- Personalized Actions (if any) -->
    <div class="personalized-section" *ngIf="personalizedActions.length > 0">
      <div class="section-title">🔥 كتب تناسبك</div>
      <div class="actions-row">
        <button
          *ngFor="let action of personalizedActions"
          class="action-card personalized"
          (click)="onActionClick(action)"
        >
          <span class="action-icon">{{ action.icon }}</span>
          <span class="action-title">{{ action.title }}</span>
        </button>
      </div>
    </div>

    <!-- Default Actions -->
    <div class="actions-row">
      <button
        *ngFor="let action of defaultActions"
        class="action-card"
        [class.ai-required]="action.requiresAI"
        (click)="onActionClick(action)"
      >
        <span class="action-icon">{{ action.icon }}</span>
        <span class="action-title">{{ action.title }}</span>
        <span class="ai-badge" *ngIf="action.requiresAI">✨</span>
      </button>
    </div>

    <!-- Category Actions -->
    <div class="section-title" *ngIf="categoryActions.length > 0">حسب التصنيف</div>
    <div class="categories-grid" *ngIf="categoryActions.length > 0">
      <button
        *ngFor="let category of categoryActions"
        class="category-card"
        (click)="onCategoryClick(category)"
      >
        <span class="category-icon">{{ category.icon }}</span>
        <span class="category-title">{{ category.title }}</span>
      </button>
    </div>
  </div>

  <!-- Sub Actions (for recommendation) -->
  <div class="sub-actions-overlay" *ngIf="showSubActions">
    <div class="sub-actions-content">
      <div class="sub-actions-header">
        <h3>{{ selectedAction?.title }}</h3>
        <button class="close-btn" (click)="closeSubActions()">✕</button>
      </div>
      <div class="sub-actions-grid">
        <button
          *ngFor="let subAction of selectedAction?.subActions"
          class="sub-action-card"
          (click)="onSubActionClick(subAction)"
        >
          <span class="sub-action-icon">{{ subAction.icon }}</span>
          <span class="sub-action-title">{{ subAction.title }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Categories Grid -->
  <div class="categories-overlay" *ngIf="showCategories">
    <div class="categories-content">
      <div class="categories-header">
        <h3>اختر التصنيف</h3>
        <button class="close-btn" (click)="closeCategories()">✕</button>
      </div>
      <div class="categories-grid-full">
        <button
          *ngFor="let category of categoryActions"
          class="category-card-full"
          (click)="onCategoryClick(category)"
        >
          <span class="category-icon">{{ category.icon }}</span>
          <span class="category-title">{{ category.title }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
