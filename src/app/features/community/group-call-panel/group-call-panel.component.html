<!-- Group Call Panel - Floating Overlay -->
<div *ngIf="callActive"
    class="fixed inset-0 z-[100] flex flex-col bg-gray-900/95 backdrop-blur-xl animate-in fade-in duration-300">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-white font-bold text-lg">مكالمة جماعية</span>
        </div>
        <div class="flex items-center gap-4 text-white/60 text-sm">
            <span class="flex items-center gap-1.5">
                <fa-icon [icon]="faUsers"></fa-icon>
                {{ participants.length + 1 }}
            </span>
            <span class="flex items-center gap-1.5 font-mono">
                <fa-icon [icon]="faClock"></fa-icon>
                {{ formatDuration(callDuration) }}
            </span>
        </div>
    </div>

    <!-- Participants Grid -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="grid gap-4 h-full" [ngClass]="getGridClass()">

            <!-- Local User Tile -->
            <div
                class="relative rounded-2xl overflow-hidden bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center min-h-[180px]">
                <!-- Avatar -->
                <div class="flex flex-col items-center gap-3">
                    <div
                        class="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center text-3xl font-bold text-white backdrop-blur-sm border-2 border-white/30">
                        {{ username.charAt(0) }}
                    </div>
                    <span class="text-white font-bold text-sm">أنت</span>
                </div>
                <!-- Muted Badge -->
                <div *ngIf="isMuted"
                    class="absolute top-3 right-3 w-8 h-8 rounded-full bg-red-500/80 flex items-center justify-center">
                    <fa-icon [icon]="faMicrophoneSlash" class="text-white text-xs"></fa-icon>
                </div>
                <!-- Speaking Indicator -->
                <div *ngIf="!isMuted"
                    class="absolute bottom-3 left-3 flex items-center gap-1.5 px-2 py-1 rounded-full bg-green-500/80 backdrop-blur-sm">
                    <fa-icon [icon]="faVolumeUp" class="text-white text-[10px]"></fa-icon>
                    <span class="text-white text-[10px] font-bold">متصل</span>
                </div>
            </div>

            <!-- Remote Participant Tiles -->
            <div *ngFor="let p of participants"
                class="relative rounded-2xl overflow-hidden bg-gradient-to-br from-gray-700 to-gray-800 flex items-center justify-center min-h-[180px]">
                <!-- Avatar -->
                <div class="flex flex-col items-center gap-3">
                    <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center text-3xl font-bold text-white backdrop-blur-sm border-2 border-white/20"
                        [class.ring-4]="p.stream" [class.ring-green-400]="p.stream">
                        {{ p.username?.charAt(0) || '?' }}
                    </div>
                    <span class="text-white font-bold text-sm">{{ p.username || 'عضو' }}</span>
                </div>
                <!-- Connection status -->
                <div class="absolute bottom-3 left-3 flex items-center gap-1.5 px-2 py-1 rounded-full backdrop-blur-sm"
                    [class.bg-green-500/80]="p.stream" [class.bg-yellow-500/80]="!p.stream">
                    <div class="w-1.5 h-1.5 rounded-full" [class.bg-white]="p.stream" [class.bg-white]="!p.stream"
                        [class.animate-pulse]="!p.stream"></div>
                    <span class="text-white text-[10px] font-bold">{{ p.stream ? 'متصل' : 'جاري الاتصال...' }}</span>
                </div>
                <!-- Hidden audio element -->
                <audio [id]="'audio-' + p.userId" autoplay playsinline class="hidden"></audio>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div
        class="flex items-center justify-center gap-4 px-6 py-5 border-t border-white/10 bg-gray-900/80 backdrop-blur-xl">
        <!-- Mute Toggle -->
        <button (click)="toggleMute()"
            class="w-14 h-14 rounded-full flex items-center justify-center transition-all duration-200"
            [class.bg-white/10]="!isMuted" [class.hover:bg-white/20]="!isMuted" [class.bg-red-500]="isMuted"
            [class.hover:bg-red-600]="isMuted">
            <fa-icon [icon]="isMuted ? faMicrophoneSlash : faMicrophone" class="text-white text-lg"></fa-icon>
        </button>

        <!-- Video Toggle -->
        <button (click)="toggleVideo()"
            class="w-14 h-14 rounded-full flex items-center justify-center transition-all duration-200"
            [class.bg-white/10]="isVideoOn" [class.hover:bg-white/20]="isVideoOn" [class.bg-gray-600]="!isVideoOn"
            [class.hover:bg-gray-500]="!isVideoOn">
            <fa-icon [icon]="isVideoOn ? faVideo : faVideoSlash" class="text-white text-lg"></fa-icon>
        </button>

        <!-- Leave Call -->
        <button (click)="leaveCall()"
            class="w-16 h-14 rounded-full bg-red-600 hover:bg-red-700 flex items-center justify-center transition-all duration-200 shadow-lg shadow-red-600/30">
            <fa-icon [icon]="faPhoneSlash" class="text-white text-lg"></fa-icon>
        </button>
    </div>

    <!-- Error Toast -->
    <div *ngIf="errorMessage"
        class="absolute top-20 left-1/2 -translate-x-1/2 px-6 py-3 bg-red-500 text-white rounded-2xl shadow-2xl text-sm font-bold animate-in slide-in-from-top-4 z-50">
        {{ errorMessage }}
    </div>
</div>
