<!-- Promotional Carousel -->
<div class="relative w-full md:w-screen pt-10 md:pt-40 overflow-hidden h-[330px] sm:h-[550px] md:h-[700px] mb-8">
  <div class="w-full h-full relative bg-white dark:bg-gray-800">
    <img
      *ngFor="let img of promoImages; let i = index"
      [src]="img"
      alt="Promotional Image"
      class="bg-white dark:bg-gray-800 absolute top-0 left-0 w-full h-full transition-opacity duration-1000 object-cover"
      [style.opacity]="promoCurrentIndex === i ? '1' : '0'"
      style="object-position: top;"
    />
  </div>
  <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2">
    <button
      *ngFor="let img of promoImages; let i = index"
      (click)="setPromoIndex(i)"
      class="w-3 h-3 rounded-full"
      [ngClass]="promoCurrentIndex === i ? 'bg-yellow-400' : 'bg-gray-300'"
      attr.aria-label="Select promotional image {{i + 1}}"
    ></button>
  </div>
</div>
<!-- وصل حديثاً -->
<section class="py-16 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-900 dark:to-gray-800">
  <div class="container mx-auto px-4">
    <div class="relative mb-8 text-center">
      <div class="relative inline-block p-4 rounded-2xl bg-gradient-to-r from-white/95 via-gray-50/95 to-white/95 backdrop-blur-sm border-2 border-gray-200/50 shadow-lg mb-4">
        <h1 class="w-auto text-3xl sm:text-4xl lg:text-5xl font-bold text-center bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent drop-shadow-sm">
          وصل حديثاً
        </h1>
      </div>
      <div class="flex items-center justify-center gap-4 mb-6">
        <div class="w-16 h-1 bg-gradient-to-r from-blue-300 to-purple-500 rounded-full"></div>
        <div class="w-4 h-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full animate-pulse"></div>
        <div class="w-16 h-1 bg-gradient-to-r from-purple-500 to-blue-300 rounded-full"></div>
      </div>
    </div>

    <div *ngIf="isLoading" class="flex space-x-4 overflow-hidden px-4 justify-center">
      <ngx-skeleton-loader count="5" appearance="circle" [theme]="{ width: '150px', height: '300px' }" class="rounded-lg"></ngx-skeleton-loader>
    </div>

    <div *ngIf="!isLoading" class="relative w-full mx-auto overflow-hidden"
      (mouseenter)="isHovered = true"
      (mouseleave)="isHovered = false"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()"
      >
      <!-- زر السابق -->
      <button
        (click)="scrollPrev()"
        class="absolute left-2 top-1/2 -translate-y-1/2 bg-white dark:bg-gray-800 rounded-full shadow dark:shadow-lg w-10 h-10 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 z-10">
        <fa-icon [icon]="faChevronLeft" class="text-gray-700 dark:text-gray-300 text-lg"></fa-icon>
      </button>

      <!-- زر التالي -->
      <button
        (click)="scrollNext()"
        class="absolute right-2 top-1/2 -translate-y-1/2 bg-white dark:bg-gray-800 rounded-full shadow dark:shadow-lg w-10 h-10 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 z-10">
        <fa-icon [icon]="faChevronRight" class="text-gray-700 dark:text-gray-300 text-lg"></fa-icon>
      </button>

      <div
        class="flex carousel-track gap-4 sm:gap-1 transition-transform duration-700 ease-in-out"
        [style.transform]="transformStyle"
        >

        <div
          *ngFor="let book of visibleBooks"
          class="w-1/3 sm:w-1/2 md:w-1/3 lg:w-1/4 p-0 shrink-0"
          >
          <!-- صورة الكتاب -->
          <div [routerLink]="['/book', getBookSlug(book.product_name)]"
            class="relative w-full sm:w-[160px] md:w-[240px] h-full sm:h-[300px] md:h-[350px] lg:h-[400px] bg-cover bg-center rounded-lg shadow-lg dark:shadow-black/50 hover:contrast-75 cursor-pointer overflow-hidden">
            <img [routerLink]="['/book', getBookSlug(book.product_name)]"
              [src]="uploadsBaseUrl + '/' + book.product_image + '.jpg'"
              (error)="handleImageError($event)"
              [alt]="book.product_name"
              class="rounded-lg w-full sm:w-[160px] md:w-[240px] h-full sm:h-[300px] md:h-[350px] lg:h-[370px] cursor-pointer object-cover object-center"
              />
            <!-- <h2
              class="bg-amber-800 text-white p-2 absolute top-0 right-0 text-[10px] sm:text-sm"
              >
              {{ book.product_name }}
            </h2> -->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- أمثلة على الشكل النهائي لخدمة الطباعة -->
<section class="py-16 bg-gradient-to-br from-slate-50 to-blue-50 dark:from-gray-900 dark:to-gray-800">
  <div class="container mx-auto px-4">
    <div class="text-center mb-12">
      <div class="relative inline-block mb-6 p-8 rounded-3xl bg-gradient-to-r from-white/95 via-gray-50/95 to-white/95 backdrop-blur-sm border-2 border-gray-200/50 shadow-lg">
        <h1 class="w-auto text-4xl md:text-5xl lg:text-6xl font-bold bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 bg-clip-text text-transparent drop-shadow-lg">
          أمثلة على الشكل النهائي لخدمة الطباعة
        </h1>
</div>
<div class="flex items-center justify-center gap-4 mb-6">
<div class="w-16 h-1 bg-gradient-to-r from-emerald-300 to-emerald-500 rounded-full"></div>
<div class="w-4 h-4 bg-gradient-to-r from-emerald-500 to-emerald-600 rounded-full animate-pulse"></div>
<div class="w-16 h-1 bg-gradient-to-r from-emerald-500 to-emerald-300 rounded-full"></div>
</div>
      <div class="relative">
        <p class="text-lg md:text-xl text-gray-600 dark:text-gray-300 max-w-2xl mx-auto leading-relaxed">
          اختر من بين خيارات الطباعة المتنوعة للحصول على أفضل جودة لكتبك
        </p>
        <div class="absolute -top-2 -left-4 w-8 h-8 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-full opacity-20 animate-pulse"></div>
        <div class="absolute -top-2 -right-4 w-6 h-6 bg-gradient-to-r from-cyan-400 to-blue-400 rounded-full opacity-20 animate-pulse delay-300"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
      <div
        class="print-image-container group"
        *ngFor="let img of printImages; let i = index"
      >
        <div class="rotating-dashed-rays opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
        <div class="print-image-shadow"></div>

        <!-- البطاقة الرئيسية -->
        <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-500 overflow-hidden group-hover:scale-105 border border-gray-100 dark:border-gray-700">
          <div class="p-6 text-center">
            <!-- الصورة -->
            <div class="relative mb-6">
              <img
                [src]="img"
                alt="Print example {{ i + 1 }}"
                class="print-image w-full max-w-[200px] mx-auto h-48 object-contain transition-transform duration-500 group-hover:scale-110"
                [style.transform]="printImageTransforms[i]"
                draggable="false"
              />
            </div>

            <!-- العنوان -->
            <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">
              {{ printImageTitles[i] }}
            </h3>

            <!-- الوصف -->
            <p class="text-gray-600 dark:text-gray-300 text-sm mb-6 leading-relaxed min-h-[3rem] flex items-center">
              {{ getPrintDescription(i) }}
            </p>

            <!-- المميزات -->
            <div class="flex flex-wrap justify-center gap-2 mb-6">
              <span class="px-3 py-1 bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs rounded-full">
                {{ getPrintFeature(i, 0) }}
              </span>
              <span class="px-3 py-1 bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 text-xs rounded-full">
                {{ getPrintFeature(i, 1) }}
              </span>
              <span class="px-3 py-1 bg-amber-100 dark:bg-amber-900 text-amber-800 dark:text-amber-200 text-xs rounded-full">
                {{ getPrintFeature(i, 2) }}
              </span>
            </div>

            <!-- زر الطلب -->
            <button
              [routerLink]="['/print']"
              class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
              <span>اطلب الآن</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="relative mb-12">
  <div class="text-center">
    <div class="relative inline-block p-6 rounded-3xl bg-gradient-to-r from-white/95 via-gray-50/95 to-white/95 backdrop-blur-sm border-2 border-gray-200/50 shadow-lg mb-4">
      <h1 class="w-auto text-3xl sm:text-4xl lg:text-5xl font-bold bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 bg-clip-text text-transparent drop-shadow-sm">
        أقسام المكتبة
      </h1>
    </div>
    <div class="flex items-center justify-center gap-4 mb-6">
      <div class="w-16 h-1 bg-gradient-to-r from-blue-300 to-blue-500 rounded-full"></div>
      <div class="w-4 h-4 bg-gradient-to-r from-blue-500 to-blue-600 rounded-full animate-pulse"></div>
      <div class="w-16 h-1 bg-gradient-to-r from-blue-500 to-blue-300 rounded-full"></div>
    </div>
  </div>
</div>

<div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-4 px-4 mb-32 md:mb-6">
    <div
    *ngFor="let category of categories; let i = index"
    class="relative group h-32 rounded-xl overflow-hidden shadow-lg transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl cursor-pointer fade-in"
    [style.animationDelay]="i * 200 + 'ms'"
    >
    <a
    [routerLink]="['/', category.id]"
    class="relative group h-32 rounded-xl overflow-hidden shadow-lg transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl cursor-pointer block"
  >
    <img
      [src]="category.image"
      alt="{{ category.name }}"
      class="w-full h-full object-cover brightness-75 group-hover:brightness-50 transition duration-300"
    />
    <div
      class="absolute inset-0 flex items-center justify-center bg-black/40 group-hover:bg-black/60 transition duration-300"
    >
      <h2 class="text-white text-lg sm:text-xl font-semibold tracking-wide drop-shadow-md">
        {{ category.name }}
      </h2>
    </div>
  </a>
      </div>
</div>
