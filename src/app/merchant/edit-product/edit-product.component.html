تم<div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-8 mt-6 md:mt-32 mb-32 md:mb-20">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header -->
    <div class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
            تعديل المنتج
          </h1>
          <p class="mt-2 text-gray-600 dark:text-gray-400">
            قم بتعديل بيانات المنتج الخاص بك
          </p>
        </div>
        <button (click)="cancel()"
          class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
          </svg>
          العودة
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex items-center justify-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <span class="mr-3 text-gray-600 dark:text-gray-400">جاري تحميل المنتج...</span>
    </div>

    <!-- Form -->
    <div *ngIf="!loading"
      class="bg-white dark:bg-gray-800 shadow-sm rounded-xl border border-gray-200 dark:border-gray-700">
      <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">بيانات المنتج</h2>
      </div>
      <div class="p-6">
        <form (ngSubmit)="saveProduct()" class="space-y-6">

          <!-- Product Name -->
          <div>
            <label for="product_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              اسم المنتج <span class="text-red-500">*</span>
            </label>
            <input type="text" id="product_name" [(ngModel)]="product.product_name" name="product_name" required
              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
              placeholder="أدخل اسم المنتج">
          </div>

          <!-- Product Price -->
          <div>
            <label for="product_price" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              السعر <span class="text-red-500">*</span>
            </label>
            <input type="number" id="product_price" [(ngModel)]="product.product_price" name="product_price" required
              min="0" step="0.01"
              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
              placeholder="أدخل السعر">
          </div>

          <!-- Category Selection -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="generalCategory" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                الفئة <span class="text-red-500">*</span>
              </label>
              <select id="generalCategory" [(ngModel)]="generalCategory" name="generalCategory" required
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                <option value="">اختر الفئة</option>
                <option *ngFor="let cat of generalCategories" [value]="cat">{{ cat }}</option>
              </select>
            </div>

            <div *ngIf="generalCategory === 'كتب'">
              <label for="book_category" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                فئة الكتاب <span class="text-red-500">*</span>
              </label>
              <select id="book_category" [(ngModel)]="product.book_category" name="book_category"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                <option value="">اختر فئة الكتاب</option>
                <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
              </select>
            </div>
          </div>

          <!-- Product Quantity -->
          <div>
            <label for="product_quantity" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              الكمية <span class="text-red-500">*</span>
            </label>
            <input type="number" id="product_quantity" [(ngModel)]="product.product_quantity" name="product_quantity"
              required min="0"
              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
              placeholder="أدخل الكمية">
          </div>

          <!-- Physical Dimensions (Shipping) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Weight -->
            <div>
              <label for="weight" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 line-clamp-1">
                الوزن (جم) <span class="text-red-500">*</span>
              </label>
              <input type="number" id="weight" [(ngModel)]="product.weight" name="weight"
                required min="1" step="1"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                placeholder="مثال: 500">
            </div>

            <!-- Length -->
            <div>
              <label for="length" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 line-clamp-1">
                الطول (سم)
              </label>
              <input type="number" id="length" [(ngModel)]="product.length" name="length"
                min="0" step="0.1"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                placeholder="اختياري">
            </div>

            <!-- Width -->
            <div>
              <label for="width" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 line-clamp-1">
                العرض (سم)
              </label>
              <input type="number" id="width" [(ngModel)]="product.width" name="width"
                min="0" step="0.1"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                placeholder="اختياري">
            </div>

            <!-- Height -->
            <div>
              <label for="height" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 line-clamp-1">
                الارتفاع (سم)
              </label>
              <input type="number" id="height" [(ngModel)]="product.height" name="height"
                min="0" step="0.1"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                placeholder="اختياري">
            </div>
          </div>

          <!-- Copy Type & Condition -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="copyType" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                نوع النسخة
              </label>
              <select id="copyType" [(ngModel)]="product.copyType" name="copyType"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                <option value="">اختر نوع النسخة</option>
                <option value="أصلي">أصلي</option>
                <option value="هاي كوبي">هاي كوبي</option>
              </select>
            </div>
            <div>
              <label for="condition" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                حالة الكتاب
              </label>
              <select id="condition" [(ngModel)]="product.condition" name="condition"
                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                <option value="">اختر حالة الكتاب</option>
                <option value="جديد">جديد</option>
                <option value="مستعمل بحالة جيدة">مستعمل بحالة جيدة</option>
              </select>
            </div>
          </div>

          <!-- Product Image Management -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              صور المنتج (حتى 3 صور)
            </label>

            <div class="grid grid-cols-3 gap-4 mb-4">
              <!-- Existing Images -->
              <div *ngFor="let img of imageUrls; let i = index" class="relative group">
                <img [src]="getProductImageUrl(img)"
                  class="w-full h-32 object-cover rounded-lg border-2 border-blue-500 shadow-sm">
                <button type="button" (click)="removeExistingImage(i)"
                  class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg opacity-0 group-hover:opacity-100 transition-opacity">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                  </svg>
                </button>
              </div>

              <!-- New Previews -->
              <div *ngFor="let preview of imagePreviews; let i = index" class="relative group">
                <img [src]="preview" class="w-full h-32 object-cover rounded-lg border-2 border-green-500 shadow-sm">
                <button type="button" (click)="removeNewImage(i)"
                  class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                  </svg>
                </button>
              </div>

              <!-- Add Button -->
              <div *ngIf="imageUrls.length + selectedFiles.length < 3"
                class="flex flex-col items-center justify-center h-32 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-500 cursor-pointer transition-colors"
                (click)="fileInput.click()"
                (dragover)="$event.preventDefault(); $event.stopPropagation();"
                (drop)="onFileDropped($event)">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span class="text-xs text-gray-500 mt-1">إضافة صورة</span>
              </div>
            </div>
            <input #fileInput type="file" (change)="onFilesSelected($event)" accept="image/*" multiple class="hidden">


            <!-- Upload Options -->
            <div class="flex gap-2">
              <button type="button" (click)="fileInput.click()"
                class="flex-1 py-3 px-4 border-2 border-blue-100 dark:border-blue-900/30 rounded-xl text-blue-600 dark:text-blue-400 font-bold hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all flex items-center justify-center group">
                <svg class="w-6 h-6 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                  </path>
                </svg>
                اختر من المعرض
              </button>
              <button type="button" (click)="startCamera()"
                class="flex-1 py-3 px-4 border-2 border-purple-100 dark:border-purple-900/30 rounded-xl text-purple-600 dark:text-purple-400 font-bold hover:bg-purple-50 dark:hover:bg-purple-900/20 transition-all flex items-center justify-center group">
                <svg class="w-6 h-6 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                  </path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                التقط صورة
              </button>
            </div>
          </div>

          <!-- Camera Modal -->
          <div *ngIf="showCameraModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90">
            <div class="relative w-full max-w-lg bg-white dark:bg-gray-800 rounded-3xl overflow-hidden shadow-2xl">
              <video #video autoplay playsinline class="w-full h-auto aspect-video object-cover"></video>
              <canvas #canvas class="hidden"></canvas>
              <div
                class="absolute bottom-0 left-0 right-0 p-6 flex justify-between items-center bg-gradient-to-t from-black/80 to-transparent">
                <button type="button" (click)="stopCamera()"
                  class="p-4 rounded-full bg-white/20 hover:bg-white/40 text-white transition-all">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                  </svg>
                </button>
                <button type="button" (click)="captureImage()"
                  class="p-6 rounded-full bg-blue-500 hover:bg-blue-600 text-white shadow-xl shadow-blue-500/40 transition-all transform hover:scale-110 active:scale-95">
                  <div class="w-8 h-8 border-4 border-white rounded-full"></div>
                </button>
                <div class="w-16"></div>
              </div>
            </div>
          </div>


          <!-- Status Display -->
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              الحالة
            </label>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="{
                'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300': product.status === 'pending',
                'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300': product.status === 'approved',
                'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300': product.status === 'rejected'
              }">
              {{ product.status === 'pending' ? 'معلق' : (product.status === 'approved' ? 'معتمد' : 'مرفوض') }}
            </span>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
              لا يمكن تعديل الحالة من هنا. يتم تحديثها من قبل الإدارة.
            </p>
          </div>

          <!-- Action Buttons -->
          <div class="flex justify-end space-x-3 space-x-reverse">
            <button type="button" (click)="cancel()"
              class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
              إلغاء
            </button>
            <button type="submit" [disabled]="saving"
              class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
              <svg *ngIf="saving" class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
              {{ saving ? 'جاري الحفظ...' : 'حفظ التغييرات' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
