<div class="max-w-md mx-auto p-4 border rounded shadow-md mt-10">
  <h2 class="text-2xl font-bold mb-4 text-center">تسجيل حساب تاجر</h2>
  <form (ngSubmit)="submitRegistration()" #registrationForm="ngForm" enctype="multipart/form-data" class="space-y-4">
    <div>
      <label for="name" class="block mb-1 font-semibold">اسم التاجر</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="name"
        name="name"
        required
        #nameInput="ngModel"
        [ngClass]="{
          'border-red-500': nameInput.invalid && (nameInput.dirty || nameInput.touched),
          'border-blue-500': nameInput.valid && (nameInput.dirty || nameInput.touched)
        }"
        class="w-full border rounded px-3 py-2"
      />
      <p *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)" class="text-red-500 text-sm mt-1">
        يرجى إدخال اسم التاجر.
      </p>
    </div>
    <div>
      <label for="email" class="block mb-1 font-semibold">البريد الإلكتروني</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        required
        #emailInput="ngModel"
        [ngClass]="{
          'border-red-500': emailInput.invalid && (emailInput.dirty || emailInput.touched),
          'border-blue-500': emailInput.valid && (emailInput.dirty || emailInput.touched)
        }"
        class="w-full border rounded px-3 py-2"
      />
      <p *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="text-red-500 text-sm mt-1">
        يرجى إدخال بريد إلكتروني صالح.
      </p>
    </div>
    <div>
      <label for="logo" class="block mb-1 font-semibold">شعار التاجر</label>
      <input
        type="file"
        id="logo"
        (change)="onFileSelected($event)"
        accept="image/*"
        required
        [ngClass]="{
          'border-red-500': imageError,
          'border-blue-500': !imageError && selectedFile
        }"
        class="w-full border rounded px-3 py-2"
      />
      <p *ngIf="imageError" class="text-red-500 text-sm mt-1">{{ imageError }}</p>
    </div>
    <button
      type="submit"
      [disabled]="!registrationForm.form.valid || !selectedFile || imageError || uploading"
      class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded w-full"
    >
      تسجيل
    </button>
  </form>
</div>
