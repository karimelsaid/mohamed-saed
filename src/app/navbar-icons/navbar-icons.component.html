<div class="flex space-x-2 lg:space-x-14">
  <!-- أيقونة المفضلة -->
  <div routerLink="/Favorites" routerLinkActive="text-blue-400" [routerLinkActiveOptions]="{exact:true}" class="relative flex flex-col sm:flex-row items-center cursor-pointer" *ngIf="isLoggedIn" #favLink="routerLinkActive">
    <fa-icon 
      [icon]="faHeart" 
      [ngClass]="{'text-blue-400': favLink.isActive, 'text-white dark:text-gray-300': !favLink.isActive}" 
      class="relative text-xs sm:text-base mb-1 sm:mb-0" 
      title="المفضلة">
    </fa-icon>
    <span [ngClass]="{'text-blue-400': favLink.isActive, 'text-white dark:text-gray-300': !favLink.isActive}" class="text-xs sm:text-xs">المفضلة</span>
    <span *ngIf="favoritesCount > 0" 
          class="absolute sm:-top-1/2 right-0 bg-blue-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">
      {{ favoritesCount }}
    </span>
  </div>

  <!-- أيقونة print -->
  <div *ngIf="isLoggedIn" class="relative flex flex-col sm:flex-row items-center cursor-pointer" routerLink="/print" routerLinkActive="text-blue-400" [routerLinkActiveOptions]="{exact:true}" #printLink="routerLinkActive">
    <fa-icon 
      [icon]="faFilePdf" 
      [ngClass]="{'text-blue-400': printLink.isActive, 'text-white dark:text-gray-300': !printLink.isActive}" 
      class="relative text-xs sm:text-base mb-1 sm:mb-0" 
      title="إطبعلي">
    </fa-icon>
    <span [ngClass]="{'text-blue-400': printLink.isActive, 'text-white dark:text-gray-300': !printLink.isActive}" class="text-xs sm:text-xs">إطبعلي</span>
  </div>

  <!-- أيقونة سلة المشتريات -->
  <div routerLink="/basket" routerLinkActive="text-blue-400" [routerLinkActiveOptions]="{exact:true}" class="relative flex flex-col sm:flex-row items-center cursor-pointer" *ngIf="isLoggedIn" #cartLink="routerLinkActive">
    <fa-icon 
     [icon]="faCartPlus" 
      [ngClass]="{'text-blue-400': cartLink.isActive, 'text-white dark:text-gray-300': !cartLink.isActive}" 
      class="relative text-xs sm:text-base mb-1 sm:mb-0" 
      title="سلة المشتريات">
    </fa-icon>
    <span [ngClass]="{'text-blue-400': cartLink.isActive, 'text-white dark:text-gray-300': !cartLink.isActive}" class="text-xs sm:text-xs text-center">سلة المشتريات</span>
    <span *ngIf="cartCount > 0" 
          class="absolute sm:-top-1/2 right-0 bg-blue-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">
      {{ cartCount }}
    </span>
  </div>
  <!-- Notification Icon -->
  <div (click)="toggleNotificationsDropdown()" class="relative flex flex-col sm:flex-row items-center cursor-pointer ml-4" *ngIf="isLoggedIn">
    <fa-icon 
      [icon]="faBell" 
      class="relative text-xs sm:text-base mb-1 sm:mb-0 text-white dark:text-gray-300"
      title="الإشعارات">
    </fa-icon>
    <span [ngClass]="{'text-orange-400': false, 'text-white dark:text-gray-300': true}" class="text-xs sm:text-xs ml-1">الإشعارات</span>
    <span *ngIf="unreadCount > 0" 
          class="absolute sm:-top-1/2 right-0 bg-red-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center cursor-pointer">
      {{ unreadCount }}
    </span>
<!-- Notifications Dropdown -->
    <div
      *ngIf="showNotificationsDropdown"
      class="rtl absolute right-2 sm:right-4 top-full mt-4 w-auto sm:w-72 md:w-80 max-h-96 bg-white dark:bg-gray-800  dark:border-gray-700 rounded-2xl shadow-xl z-50 flex flex-col"
    >
      <div *ngIf="notifications.length === 0" class="p-4 text-center text-gray-700 dark:text-gray-300 text-sm">
        لا توجد إشعارات
      </div>

      <div
        *ngFor="let notification of notifications"
        class="p-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 transition-colors cursor-pointer"
        [ngClass]="{ 'bg-gray-100 dark:bg-gray-700': !notification.read }"
        (click)="markNotificationAsRead(notification)"
      >
        <div class="text-sm text-gray-800 dark:text-gray-200 flex-1">
          {{ notification.message }}
        </div>

        <div class="flex gap-3 text-xs">
          <button
            class="text-blue-500 hover:text-blue-700 transition"
            (click)="markNotificationAsRead(notification); $event.stopPropagation();"
          >
            وضع كمقروء
          </button>
          <button
            class="text-red-500 hover:text-red-700 transition"
            (click)="deleteNotification(notification); $event.stopPropagation();"
            title="حذف الإشعار"
          >
            <fa-icon [icon]="faTrash"></fa-icon>
          </button>
        </div>
      </div>
    </div>


  </div>
  <!-- ايقونة requests -->
   <div class="hidden md:flex">
     <div *ngIf="isLoggedIn" class="relative flex flex-col sm:flex-row items-center cursor-pointer " [ngClass]="{'text-orange-400': isOrdersActive}"  routerLink="/requests" >
         <fa-icon 
         [icon]="faClipboardList"
         [ngClass]="{'text-orange-400': isOrdersActive, 'text-white dark:text-gray-300': !isOrdersActive}"
         class="relative text-xs sm:text-base mb-1 sm:mb-0"
         title="طلباتي">
         </fa-icon>
         <span [ngClass]="{'text-orange-400': isOrdersActive, 'text-white dark:text-gray-300': !isOrdersActive}" class="text-xs sm:text-xs">طلباتي</span>
     <span *ngIf="orderCount > 0" 
           class="absolute sm:-top-1/2 right-0 bg-blue-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">
         {{ orderCount }}
     </span>
     </div>
   </div>
  <!-- ايقونة الحساب -->
   <div class="md:flex" [ngClass]="{'hidden': isLoggedIn}">
     <div (click)="openAccountModal()" class="relative flex flex-col sm:flex-row items-center cursor-pointer" [ngClass]="{'text-orange-400': isAccountActive, 'text-white': !isAccountActive}">
       <fa-icon 
         [icon]="faUser" 
         class="text-xs sm:text-base mb-1 sm:mb-0"
         [ngClass]="{'text-orange-400': isAccountActive, 'text-white dark:text-gray-300': !isAccountActive}" 
         title="ايقونة الحساب">
       </fa-icon>
       <span [ngClass]="{'text-orange-400': isAccountActive, 'text-white dark:text-gray-300': !isAccountActive}" class="text-xs sm:text-xs">حسابي</span>
     </div>
   </div>
  
  <!-- رابط لوحة التحكم للمسؤول فقط -->
  <div *ngIf="isAdmin" routerLink="/ControlPanel" routerLinkActive="text-orange-400" [routerLinkActiveOptions]="{exact:true}" class="flex flex-col sm:flex-row items-center cursor-pointer ml-4 text-xs sm:text-base" #adminLink="routerLinkActive">
    <fa-icon [icon]="faTachometerAlt" [ngClass]="{'text-orange-400': adminLink.isActive, 'text-white dark:text-gray-300': !adminLink.isActive}" class="text-xs sm:text-base mb-1 sm:mb-0" title="لوحة التحكم"></fa-icon>
    <span [ngClass]="{'text-orange-400': adminLink.isActive, 'text-white dark:text-gray-300': !adminLink.isActive}" class="ml-1 text-xs sm:text-x text-centers">لوحة التحكم</span>
  </div>
</div>
<app-account-modal #accountModal (modalClosed)="showAccountModal = false"></app-account-modal>
