<div class="relative w-full">
  <div class="search-bar-container relative">
    <div class="relative w-full">
      <!-- Search Input Container -->
      <div
        class="relative flex items-center bg-white dark:bg-gray-800 rounded-full shadow-md hover:shadow-lg transition-shadow duration-300 border border-gray-200 dark:border-gray-700">
        <!-- Search Icon -->
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 dark:text-gray-500">
          <fa-icon [icon]="faSearch" class="text-base"></fa-icon>
        </div>

        <!-- Input Field -->
        <input [(ngModel)]="searchQuery" (keyup)="onSearchKeyup()" (keydown)="onEnterPress($event)" #inputElement
          type="text" placeholder="بحث..."
          class="w-full h-10 pl-10 pr-10 py-2 text-sm bg-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 transition-all duration-200" />

        <!-- Filter Icon -->
        <div
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 dark:text-gray-500 hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer transition-colors duration-200"
          (click)="toggleFilterDropdown()">
          <fa-icon [icon]="faFilter" class="text-base"></fa-icon>
        </div>
      </div>

      <!-- Suggestions Dropdown -->
      <div *ngIf="showSuggestions"
        class="absolute w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 mt-2 rounded-lg shadow-xl max-h-60 overflow-y-auto z-[1001]">
        <ul class="divide-y divide-gray-100 dark:divide-gray-700">
          <li *ngFor="let result of searchResults"
            (click)="selectSuggestion(result.item.product_name || result.item.name || '')"
            class="p-3 cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700 dark:text-gray-100 transition-colors duration-150 first:rounded-t-lg last:rounded-b-lg">
            <div class="flex items-center justify-between">
              <div class="flex items-center">
                <fa-icon [icon]="faBook" class="text-blue-500 mr-3 text-sm"></fa-icon>
                <span class="font-medium text-sm" [innerHTML]="result.highlighted"></span>
              </div>
              <div class="text-xs text-gray-500 dark:text-gray-400 ml-4">
                <span *ngIf="result.item.sku">{{ result.item.sku }}</span>
                <span *ngIf="result.item.category"> • {{ result.item.category }}</span>
              </div>
            </div>
          </li>
        </ul>
      </div>

      <!-- Filter Dropdown -->
      <div *ngIf="showFilterDropdown"
        class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl z-[1001]">
        <ul class="divide-y divide-gray-100 dark:divide-gray-700">
          <li (click)="selectFilter('recentlyAdded')"
            class="p-3 cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700 dark:text-gray-100 transition-colors duration-150 first:rounded-t-lg">
            <div class="flex items-center">
              <fa-icon [icon]="faClock" class="text-green-500 mr-3 text-sm"></fa-icon>
              <span class="text-sm">المضاف حديثًا</span>
            </div>
          </li>
          <li (click)="selectFilter('all')"
            class="p-3 cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700 dark:text-gray-100 transition-colors duration-150 last:rounded-b-lg">
            <div class="flex items-center">
              <fa-icon [icon]="faList" class="text-blue-500 mr-3 text-sm"></fa-icon>
              <span class="text-sm">الكل</span>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
