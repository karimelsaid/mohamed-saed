<div class="modal-overlay" *ngIf="status !== 'idle' && (status !== 'complete' || progress > 0)">
  <div class="modal-container ripple-animation">
    <div class="modal-header">
      <div class="icon-wrapper" [class.rotating]="status === 'downloading' || status === 'applying'">
        <fa-icon [icon]="statusIcon"></fa-icon>
      </div>
      <h2 class="title">✨ تحديث جديد ✨</h2>
      <p class="version-tag">الإصدار {{ version }}</p>
      <div class="size-tag" *ngIf="sizeFormatted && (status === 'checking' || status === 'error')">
        {{ updateSizeText }}
      </div>
    </div>

    <div class="modal-body">
      <p class="status-msg">{{ statusText }}</p>
      
      <div class="progress-wrapper" *ngIf="status === 'downloading'">
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="progress"></div>
        </div>
        <div class="progress-info">
          <span class="progress-text">{{ progress }}%</span>
          <span class="size-text" *ngIf="sizeBytes">{{ downloadedSizeText }}</span>
        </div>
      </div>

      <div class="error-msg" *ngIf="status === 'error'">
        {{ errorMessage }}
      </div>

      <div class="description" *ngIf="status === 'checking' || (status === 'error' && !progress)">
        لقد قمنا ببعض التحسينات السحرية لجعل تجربتك أكثر سهولة وحيوية. دعنا ننتقل سوياً للإصدار الجديد لنبدأ رحلة ممتعة أكثر! 🌈
      </div>
    </div>

    <div class="modal-footer" *ngIf="status === 'checking' || status === 'error'">
      <button class="update-btn" (click)="update()">
        <span>هيا بنا للتحديث! 🚀</span>
      </button>
      <button class="postpone-btn" (click)="postpone()">
        <span>تأجيل التحديث ⏳</span>
      </button>
    </div>
  </div>
</div>
