<div class="fixed bottom-24 left-4 z-50">
    <button (click)="navigateToPromotions()"
        class="relative w-14 h-14 rounded-full bg-gradient-to-r from-promo-primary to-promo-secondary shadow-lg flex items-center justify-center text-white hover:scale-110 active:scale-95 transition-all duration-300 group overflow-visible">

        <!-- Icon -->
        <fa-icon [icon]="faGift" class="text-2xl"></fa-icon>

        <!-- Tooltip (Mobile Optimized) -->
        <span
            class="absolute left-full ml-3 bg-gray-900/90 backdrop-blur-sm text-white text-xs py-2 px-3 rounded-xl opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap pointer-events-none shadow-xl border border-white/10">
            العروض والهدايا 🎉
        </span>

        <!-- Badge (Optional - Pulse effect) -->
        <span
            class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full border-2 border-white dark:border-gray-800 animate-pulse"></span>
    </button>
</div>
