<!-- Tutorial Overlay -->
<div *ngIf="isVisible" class="fixed inset-0 bg-gradient-to-br from-black/70 via-black/60 to-black/70 dark:from-black/80 dark:via-black/70 dark:to-black/80 z-[999] backdrop-blur-sm" (click)="skipTutorial()"></div>

<!-- Tutorial Modal -->
<div *ngIf="isVisible" class="fixed bottom-0 left-1/2 transform -translate-x-1/2 z-[1001] p-4 animate-in fade-in-0 zoom-in-95 duration-300" [ngClass]="positionClass">
  <div class="relative bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl rounded-2xl max-w-lg w-[85vw] sm:w-[80vw] shadow-2xl dark:shadow-slate-900/60 border border-white/20 dark:border-slate-700/50 overflow-hidden">

    <!-- Decorative Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-blue-50/50 via-purple-50/30 to-pink-50/50 dark:from-blue-900/20 dark:via-purple-900/10 dark:to-pink-900/20 pointer-events-none"></div>

    <!-- Header Section -->
    <div class="relative px-6 pt-6 pb-4">
      <div class="flex justify-between items-start mb-4">
        <div class="flex-1">
          <div class="inline-flex items-center gap-2 px-3 py-1 bg-gradient-to-r from-blue-100 to-purple-100 dark:from-blue-900/50 dark:to-purple-900/50 rounded-full text-xs font-medium text-blue-700 dark:text-blue-300 mb-3">
            <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
            خطوة {{ currentStepIndex + 1 }} من {{ totalSteps }}
          </div>
          <h3 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-gray-900 via-blue-900 to-purple-900 dark:from-white dark:via-blue-100 dark:to-purple-100 bg-clip-text text-transparent leading-tight">
            {{ currentStep?.title }}
          </h3>
        </div>
        <div class="flex gap-1 ml-4">
          <span (click)="disableTutorialPermanently()" class="p-2 text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition-all duration-200 group">عدم الإظهار مرة أخرى</span>
          <button
            class="p-2 text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition-all duration-200 group"
            (click)="disableTutorialPermanently()"
            aria-label="عدم الإظهار مرة أخرى"
            title="عدم الإظهار مرة أخرى">
              <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
          </button>
          
          <button
            class="p-2 text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition-all duration-200 group"
            (click)="skipTutorial()"
            aria-label="إغلاق الدرس">
            <fa-icon [icon]="faTimes" class="group-hover:scale-110 transition-transform"></fa-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Content Section -->
    <div class="relative px-6 pb-6">
      <div class="mb-6">
        <p class="text-gray-600 dark:text-gray-300 text-base sm:text-lg leading-relaxed text-center">
          {{ currentStep?.description }}
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between gap-3 mb-6">
        <button
          (click)="previousStep()"
          [disabled]="isFirstStep()"
          class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-gray-100 hover:bg-gray-200 disabled:bg-gray-50 disabled:cursor-not-allowed text-gray-700 disabled:text-gray-400 dark:bg-slate-700 dark:hover:bg-slate-600 dark:disabled:bg-slate-800 dark:text-gray-300 dark:disabled:text-gray-500 rounded-xl transition-all duration-200 font-medium text-sm group"
          aria-label="السابق">
          <fa-icon [icon]="faChevronLeft" class="group-hover:-translate-x-0.5 transition-transform"></fa-icon>
          السابق
        </button>
        <button
          (click)="nextStep()"
          class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 dark:from-blue-500 dark:to-purple-500 dark:hover:from-blue-600 dark:hover:to-purple-600 text-white rounded-xl transition-all duration-200 font-medium text-sm shadow-lg hover:shadow-xl group"
          aria-label="التالي">
          {{ isLastStep() ? 'إنهاء الجولة' : 'التالي' }}
          <fa-icon [icon]="faChevronRight" class="group-hover:translate-x-0.5 transition-transform"></fa-icon>
        </button>
      </div>

      <!-- Progress Bar -->
      <div class="relative">
        <div class="h-2 bg-gray-200 dark:bg-slate-700 rounded-full overflow-hidden shadow-inner">
          <div
            class="h-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 transition-all duration-500 ease-out rounded-full shadow-sm"
            [style.width.%]="getProgressPercentage()">
          </div>
        </div>
        <div class="flex justify-between mt-2 text-xs text-gray-500 dark:text-gray-400">
          <span>البداية</span>
          <span class="font-medium">{{ getRoundedProgressPercentage() }}%</span>
          <span>النهاية</span>
        </div>
      </div>
    </div>
  </div>
</div>
